name: Fork Release

on:
  push:
    tags: ["aspulse-v*"]

permissions:
  contents: read

jobs:
  build_bundle:
    name: Build JS bundle
    if: github.repository == 'AsPulse/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^aspulse-v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$ ]]; then
            echo "::error::Expected a tag of the form aspulse-vX.Y.Z or aspulse-vX.Y.Z-N."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Read public relay configuration
        id: public_config
        shell: bash
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value="$(sed -n "s|^T3CODE_${name}=||p" .env.example)"
            echo "T3CODE_${name}=$value" >> "$GITHUB_ENV"
            echo "${name,,}=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  desktop_linux_x64:
    needs: build_bundle
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false
      relay_client_tracing: false
      release_channel: stable
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}

  desktop_mac_arm64:
    needs: build_bundle
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false
      launch_check: true
      relay_client_tracing: false
      release_channel: stable
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}

  release:
    needs: [build_bundle, desktop_linux_x64, desktop_mac_arm64]
    if: ${{ !cancelled() && needs.desktop_linux_x64.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: release-assets

      - name: Download macOS artifacts
        if: needs.desktop_mac_arm64.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: release-assets

      - name: Publish Release
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build_bundle.outputs.version }}
          MAC_RESULT: ${{ needs.desktop_mac_arm64.result }}
        run: |
          assets=("t3-${VERSION}-linux-x64.tar.gz")
          if [[ "$MAC_RESULT" == "success" ]]; then
            assets+=(*.dmg)
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "AsPulse T3 Code ${GITHUB_REF_NAME#aspulse-}" \
            --notes "Built from $GITHUB_SHA." "${assets[@]}" SHA256SUMS
